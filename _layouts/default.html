<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'es' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <meta name="theme-color" content="#1a2039">

    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <link rel="alternate" hreflang="es" href="{{ '/' | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ '/en/' | absolute_url }}">

    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=panchang@700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

    <!-- Entrances only hide when JS is on; the timer guarantees they come back
         even if main.js never loads. -->
    <script>
      document.documentElement.classList.add("js");
      setTimeout(function () {
        document.documentElement.classList.add("reveal-off");
      }, 3000);
    </script>
  </head>
  <body>
    {% if page.lang == 'en' %}<a class="skip-link" href="#content">Skip to content</a>{% else %}<a class="skip-link" href="#contenido">Saltar al contenido</a>{% endif %}
    {{ content }}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
